services:
  mysql:
    image: "${SANDWISH_IT_MYSQL_IMAGE:-sandwish/mysql:8.4}"
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: "${SANDWISH_IT_MYSQL_DATABASE:-sandwish_integration}"
      MYSQL_ROOT_PASSWORD: "${SANDWISH_IT_MYSQL_ROOT_PASSWORD:-sandwish_it_root}"
      MYSQL_USER: "${SANDWISH_IT_MYSQL_USER:-sandwish_it}"
      MYSQL_PASSWORD: "${SANDWISH_IT_MYSQL_PASSWORD:-sandwish_it}"
    ports:
      - "${SANDWISH_IT_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - integration

  redis:
    image: "${SANDWISH_IT_REDIS_IMAGE:-sandwish/redis:7.4-alpine}"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${SANDWISH_IT_REDIS_PASSWORD:-sandwish_it_redis}",
      ]
    ports:
      - "${SANDWISH_IT_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${SANDWISH_IT_REDIS_PASSWORD:-sandwish_it_redis}\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - integration

  rocketmq-namesrv:
    image: "${SANDWISH_IT_ROCKETMQ_IMAGE:-sandwish/rocketmq:5.4.0}"
    command: ["nameserver"]
    environment:
      HEAP_OPTS: "${SANDWISH_IT_ROCKETMQ_NAMESRV_HEAP_OPTS:--Xms128m -Xmx128m -Xmn64m}"
    ports:
      - "${SANDWISH_IT_ROCKETMQ_NAMESRV_PORT:-19876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - integration

  rocketmq-broker:
    image: "${SANDWISH_IT_ROCKETMQ_IMAGE:-sandwish/rocketmq:5.4.0}"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["broker", "-n", "rocketmq-namesrv:9876"]
    environment:
      HEAP_OPTS: "${SANDWISH_IT_ROCKETMQ_BROKER_HEAP_OPTS:--Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m}"
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    ports:
      - "${SANDWISH_IT_ROCKETMQ_BROKER_PORT:-20911}:10911"
      - "${SANDWISH_IT_ROCKETMQ_BROKER_HA_PORT:-20912}:10909"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - integration

networks:
  integration:
    name: "${SANDWISH_IT_NETWORK:-sandwish-it-net}"

volumes:
  mysql-data:
  redis-data:
