name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-web-quality:
    name: Admin Web Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sandwish-admin-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sandwish-admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run spotless check
        run: mvn -q spotless:check

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run checkstyle
        run: mvn -q checkstyle:check

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run verify
        run: mvn -q verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Prepare integration infrastructure images
        run: |
          docker pull mysql:8.4
          docker pull redis:7.4-alpine
          docker pull apache/rocketmq:5.4.0
          docker tag mysql:8.4 sandwish/mysql:8.4
          docker tag redis:7.4-alpine sandwish/redis:7.4-alpine
          docker tag apache/rocketmq:5.4.0 sandwish/rocketmq:5.4.0

      - name: Start integration services
        run: |
          cp deploy/integration/.env.example deploy/integration/.env
          echo "SANDWISH_IT_NETWORK=sandwish-it-pr-net" >> deploy/integration/.env
          docker compose \
            --project-name sandwish-integration-pr \
            --env-file deploy/integration/.env \
            -f deploy/integration/docker-compose.yml \
            up -d

      - name: Wait for integration services
        run: |
          for service in mysql redis rocketmq-namesrv rocketmq-broker; do
            container="sandwish-integration-pr-${service}-1"
            echo "Waiting for ${container}"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${container}")"
              if [ "${status}" = "healthy" ]; then
                echo "${container} is healthy"
                break
              fi
              if [ "${attempt}" = "60" ]; then
                docker logs "${container}" || true
                echo "${container} did not become healthy; last status: ${status}" >&2
                exit 1
              fi
              sleep 5
            done
          done

      - name: Run integration tests
        run: mvn -q verify -Pit

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/failsafe-reports/*.xml
            **/target/failsafe-reports/*.txt

      - name: Stop integration services
        if: always()
        run: |
          docker compose \
            --project-name sandwish-integration-pr \
            --env-file deploy/integration/.env \
            -f deploy/integration/docker-compose.yml \
            down -v
