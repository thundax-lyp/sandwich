server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin-api/actuator/health {
        return 404;
    }

    location ^~ /admin-api/actuator/ {
        return 404;
    }

    location = /admin-api/swagger-ui.html {
        return 404;
    }

    location = /admin-api/v2/api-docs {
        return 404;
    }

    location ^~ /admin-api/swagger-resources {
        return 404;
    }

    location ^~ /admin-api/webjars/ {
        return 404;
    }

    location ^~ /admin-api/ {
        proxy_pass http://sandwish-admin-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /front-api/actuator/health {
        return 404;
    }

    location ^~ /front-api/actuator/ {
        return 404;
    }

    location = /front-api/swagger-ui.html {
        return 404;
    }

    location = /front-api/v2/api-docs {
        return 404;
    }

    location ^~ /front-api/swagger-resources {
        return 404;
    }

    location ^~ /front-api/webjars/ {
        return 404;
    }

    location ^~ /front-api/ {
        proxy_pass http://sandwish-front-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /open-api/actuator/health {
        return 404;
    }

    location ^~ /open-api/actuator/ {
        return 404;
    }

    location = /open-api/swagger-ui.html {
        return 404;
    }

    location = /open-api/v2/api-docs {
        return 404;
    }

    location ^~ /open-api/swagger-resources {
        return 404;
    }

    location ^~ /open-api/webjars/ {
        return 404;
    }

    location ^~ /open-api/ {
        proxy_pass http://sandwish-open-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html/front;
        try_files $uri $uri/ /index.html;
    }
}
