server:
  port: ${SERVER_PORT:20009}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/admin-api}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: sandwish-admin-api

  main:
    bannerMode: "off"

  jmx:
    default-domain: sandwish-admin-api

  datasource:
    driver-class-name: ${SANDWISH_DB_DRIVER:com.mysql.jdbc.Driver}
    url: ${SANDWISH_DB_URL:jdbc:mysql://127.0.0.1:3306/sandwish?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SANDWISH_DB_USERNAME:sandwish}
    password: ${SANDWISH_DB_PASSWORD:}

  redis:
    url: ${SANDWISH_REDIS_URI:redis://127.0.0.1:6379/0}
    password: ${SANDWISH_REDIS_PASSWORD:}
    timeout: ${SANDWISH_REDIS_TIMEOUT:5s}

  mvc:
    throw-exception-if-no-handler-found: true

  thymeleaf:
    enabled: false

  resources:
    add-mappings: false

  messages:
    basename: i18n/messages

  servlet:
    multipart:
      max-file-size: 20971520
      max-request-size: 20971520

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

jasypt:
  encryptor:
    bean: jasyptStringEncryptor

jetcache:
  statIntervalMinutes: 15
  areaInCacheName: true
  local:
    default:
      type: linkedhashmap
      keyConvertor: fastjson
      limit: 10000
  remote:
    default:
      type: redis.lettuce
      uri: ${SANDWISH_REDIS_URI:redis://127.0.0.1:6379/0}
      keyConvertor: fastjson
      valueEncoder: java
      valueDecoder: java

sandwish:
  oss:
    type: ${SANDWISH_OSS_TYPE:local}
    local:
      root-path: ${SANDWISH_OSS_LOCAL_ROOT_PATH:storage}
      location-prefix: ${SANDWISH_OSS_LOCAL_LOCATION_PREFIX:file:}
    s3:
      endpoint: ${SANDWISH_OSS_S3_ENDPOINT:}
      region: ${SANDWISH_OSS_S3_REGION:us-east-1}
      bucket: ${SANDWISH_OSS_S3_BUCKET:}
      access-key: ${SANDWISH_OSS_S3_ACCESS_KEY:}
      secret-key: ${SANDWISH_OSS_S3_SECRET_KEY:}
      location-prefix: ${SANDWISH_OSS_S3_LOCATION_PREFIX:}
      path-style-access: ${SANDWISH_OSS_S3_PATH_STYLE_ACCESS:true}

logging:
  config: classpath:config/logback-spring.xml
  level:
    com.github.thundax: INFO

swagger:
  base-package: com.github.thundax.modules
  title: Sandwich Admin API
  description: Sandwich 后台服务接口
