services:
  nginx:
    image: "${SANDWISH_NGINX_RUNTIME_IMAGE:-sandwish/nginx:dev}"
    depends_on:
      sandwish-admin-api:
        condition: service_started
      sandwish-front-api:
        condition: service_started
    ports:
      - "${SANDWISH_PUBLIC_HTTP_PORT:-18080}:80"
    networks:
      - public
      - backend

  sandwish-admin-api:
    image: "${SANDWISH_ADMIN_API_IMAGE:-sandwish/admin-api:dev}"
    working_dir: /app
    command: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /admin-api
      SPRING_PROFILES_ACTIVE: "${SANDWISH_SPRING_PROFILES_ACTIVE:-docker}"
      SPRING_DATASOURCE_URL: "${SANDWISH_DB_URL}"
      SPRING_DATASOURCE_USERNAME: "${SANDWISH_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SANDWISH_DB_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SANDWISH_DB_DRIVER}"
      SANDWISH_REDIS_URI: "${SANDWISH_REDIS_URI}"
      SANDWISH_REDIS_PASSWORD: "${SANDWISH_REDIS_PASSWORD}"
      SANDWISH_REDIS_TIMEOUT: "${SANDWISH_REDIS_TIMEOUT}"
      SANDWISH_MQ_ENABLED: "${SANDWISH_MQ_ENABLED}"
      SANDWISH_MQ_TYPE: "${SANDWISH_MQ_TYPE}"
      SANDWISH_ROCKETMQ_NAME_SERVER: "${SANDWISH_ROCKETMQ_NAME_SERVER}"
      SANDWISH_ROCKETMQ_PRODUCER_GROUP: "${SANDWISH_ROCKETMQ_PRODUCER_GROUP}"
      SANDWISH_LOG_SYS_TOPIC: "${SANDWISH_LOG_SYS_TOPIC}"
      SANDWISH_LOG_SYS_TAG: "${SANDWISH_LOG_SYS_TAG}"
      SANDWISH_LOG_SYS_CONSUMER_GROUP: "${SANDWISH_LOG_SYS_CONSUMER_GROUP}"
      SANDWISH_LOG_STORAGE_PATH: "${SANDWISH_LOG_STORAGE_PATH}"
      SANDWISH_OSS_TYPE: "${SANDWISH_OSS_TYPE}"
      SANDWISH_OSS_LOCAL_ROOT_PATH: "${SANDWISH_OSS_LOCAL_ROOT_PATH}"
      SANDWISH_OSS_LOCAL_LOCATION_PREFIX: "${SANDWISH_OSS_LOCAL_LOCATION_PREFIX}"
      SANDWISH_OSS_S3_ENDPOINT: "${SANDWISH_OSS_S3_ENDPOINT}"
      SANDWISH_OSS_S3_REGION: "${SANDWISH_OSS_S3_REGION}"
      SANDWISH_OSS_S3_BUCKET: "${SANDWISH_OSS_S3_BUCKET}"
      SANDWISH_OSS_S3_ACCESS_KEY: "${SANDWISH_OSS_S3_ACCESS_KEY}"
      SANDWISH_OSS_S3_SECRET_KEY: "${SANDWISH_OSS_S3_SECRET_KEY}"
      SANDWISH_OSS_S3_LOCATION_PREFIX: "${SANDWISH_OSS_S3_LOCATION_PREFIX}"
      SANDWISH_OSS_S3_PATH_STYLE_ACCESS: "${SANDWISH_OSS_S3_PATH_STYLE_ACCESS}"
      JAVA_OPTS: "${JAVA_OPTS}"
    volumes:
      - admin-storage:/app/storage
    networks:
      - backend

  sandwish-front-api:
    image: "${SANDWISH_FRONT_API_IMAGE:-sandwish/front-api:dev}"
    working_dir: /app
    command: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /front-api
      SPRING_PROFILES_ACTIVE: "${SANDWISH_SPRING_PROFILES_ACTIVE:-docker}"
      SPRING_DATASOURCE_URL: "${SANDWISH_DB_URL}"
      SPRING_DATASOURCE_USERNAME: "${SANDWISH_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SANDWISH_DB_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SANDWISH_DB_DRIVER}"
      SANDWISH_REDIS_URI: "${SANDWISH_REDIS_URI}"
      SANDWISH_REDIS_PASSWORD: "${SANDWISH_REDIS_PASSWORD}"
      SANDWISH_REDIS_TIMEOUT: "${SANDWISH_REDIS_TIMEOUT}"
      SANDWISH_OSS_TYPE: "${SANDWISH_OSS_TYPE}"
      SANDWISH_OSS_LOCAL_ROOT_PATH: "${SANDWISH_OSS_LOCAL_ROOT_PATH}"
      SANDWISH_OSS_LOCAL_LOCATION_PREFIX: "${SANDWISH_OSS_LOCAL_LOCATION_PREFIX}"
      SANDWISH_OSS_S3_ENDPOINT: "${SANDWISH_OSS_S3_ENDPOINT}"
      SANDWISH_OSS_S3_REGION: "${SANDWISH_OSS_S3_REGION}"
      SANDWISH_OSS_S3_BUCKET: "${SANDWISH_OSS_S3_BUCKET}"
      SANDWISH_OSS_S3_ACCESS_KEY: "${SANDWISH_OSS_S3_ACCESS_KEY}"
      SANDWISH_OSS_S3_SECRET_KEY: "${SANDWISH_OSS_S3_SECRET_KEY}"
      SANDWISH_OSS_S3_LOCATION_PREFIX: "${SANDWISH_OSS_S3_LOCATION_PREFIX}"
      SANDWISH_OSS_S3_PATH_STYLE_ACCESS: "${SANDWISH_OSS_S3_PATH_STYLE_ACCESS}"
      JAVA_OPTS: "${JAVA_OPTS}"
    volumes:
      - front-storage:/app/storage
    networks:
      - backend

  mysql:
    image: "${SANDWISH_MYSQL_IMAGE:-sandwish/mysql:8.4}"
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - sandwish-mysql-data:/var/lib/mysql
      - ../db/schema/system.sql:/docker-entrypoint-initdb.d/01-schema-system.sql:ro
      - ../db/data/system.sql:/docker-entrypoint-initdb.d/02-data-system.sql:ro
      - ../db/schema/auth.sql:/docker-entrypoint-initdb.d/03-schema-auth.sql:ro
      - ../db/data/auth.sql:/docker-entrypoint-initdb.d/04-data-auth.sql:ro
      - ../db/schema/storage.sql:/docker-entrypoint-initdb.d/05-schema-storage.sql:ro
      - ../db/data/storage.sql:/docker-entrypoint-initdb.d/06-data-storage.sql:ro
      - ../db/schema/member.sql:/docker-entrypoint-initdb.d/07-schema-member.sql:ro
      - ../db/data/member.sql:/docker-entrypoint-initdb.d/08-data-member.sql:ro
      - ../db/schema/audit.sql:/docker-entrypoint-initdb.d/09-schema-audit.sql:ro
      - ../db/data/audit.sql:/docker-entrypoint-initdb.d/10-data-audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  redis:
    image: "${SANDWISH_REDIS_IMAGE:-sandwish/redis:7.4-alpine}"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sandwish-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - backend

  rocketmq-namesrv:
    image: "${SANDWISH_ROCKETMQ_IMAGE:-sandwish/rocketmq:5.4.0}"
    command: ["sh", "mqnamesrv"]
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-19876}:9876"
    volumes:
      - "${SANDWISH_ROCKETMQ_NAMESRV_LOG_PATH:-./data/rocketmq/namesrv/logs}:/home/rocketmq/logs"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend

  rocketmq-broker:
    image: "${SANDWISH_ROCKETMQ_IMAGE:-sandwish/rocketmq:5.4.0}"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876"]
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    ports:
      - "${ROCKETMQ_BROKER_PORT:-20911}:10911"
      - "${ROCKETMQ_BROKER_FAST_PORT:-20909}:10909"
    volumes:
      - "${SANDWISH_ROCKETMQ_BROKER_STORE_PATH:-./data/rocketmq/broker/store}:/home/rocketmq/store"
      - "${SANDWISH_ROCKETMQ_BROKER_LOG_PATH:-./data/rocketmq/broker/logs}:/home/rocketmq/logs"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  minio:
    image: "${SANDWISH_MINIO_IMAGE:-sandwish/minio:RELEASE.2025-02-28T09-55-16Z}"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${SANDWISH_OSS_S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${SANDWISH_OSS_S3_SECRET_KEY}"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - "${SANDWISH_MINIO_DATA_PATH:-./data/minio}:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend

  minio-init:
    image: "${SANDWISH_MINIO_MC_IMAGE:-sandwish/minio-mc:RELEASE.2025-02-21T16-00-46Z}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set sandwish http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "sandwish/$${SANDWISH_OSS_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: "${SANDWISH_OSS_S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${SANDWISH_OSS_S3_SECRET_KEY}"
      SANDWISH_OSS_S3_BUCKET: "${SANDWISH_OSS_S3_BUCKET}"
    networks:
      - backend

networks:
  public:
  backend:

volumes:
  admin-storage:
  front-storage:
  sandwish-mysql-data:
  sandwish-redis-data:
